<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products — Sit Cover Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/shop-logo.webp" type="image/webp">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-nav="products-all">
  <div id="preloader">
    <div class="pre-card">
      <img src="assets/shop-logo.webp" alt="logo">
      <div class="pre-name">Sit Cover Admin</div>
      <div class="pre-sub">Products</div>
      <div class="pre-bar"><i></i></div>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="side" id="adminSide"></aside>

  <div class="main">
    <header class="top" id="adminTop"></header>

    <div class="wrap-a">
      <div class="login-err" id="bootErr"></div>

      <div class="page-head">
        <div>
          <h2 id="pgTitle">All Products</h2>
          <div class="sub" id="pgSub">Loading…</div>
        </div>
        <button class="btn btn-pri" id="btnAdd">＋ Add Product</button>
      </div>

      <div id="pList"></div>
    </div>
  </div>

  <div class="mask" id="mMask"></div>
  <div class="modal" id="pModal">
    <div class="m-head">
      <h3 id="mTitle">Add Product</h3>
      <button class="x" id="mClose" type="button">✕</button>
    </div>
    <div class="m-body">
      <div class="field">
        <label for="pfName">Product name <span class="req">*</span></label>
        <input id="pfName" type="text" maxlength="120" placeholder="e.g. Universal TV Remote">
      </div>
      <div class="row2">
        <div class="field">
          <label for="pfPrice">Price (KD) <span class="req">*</span></label>
          <input id="pfPrice" type="number" min="0" step="0.001" inputmode="decimal" placeholder="e.g. 2.500">
        </div>
        <div class="field">
          <label for="pfCat">Category <span class="req">*</span></label>
          <select id="pfCat"></select>
        </div>
      </div>
      <div class="field">
        <label for="pfDesc">Details / description</label>
        <textarea id="pfDesc" maxlength="2000" placeholder="Materials, compatibility, warranty, what is included…"></textarea>
      </div>
      <div class="row2">
        <div class="field">
          <label for="pfOrder">Sort number</label>
          <input id="pfOrder" type="number" step="1" value="0">
          <div class="tip">Lower number shows first</div>
        </div>
        <div class="field">
          <label>Stock</label>
          <div style="display:flex;align-items:center;gap:10px;padding-top:6px">
            <label class="switch"><input type="checkbox" id="pfStock" checked><i></i></label>
            <span id="pfStockTxt" style="font-size:13px;font-weight:700;color:#16a34a">In stock (visible on website)</span>
          </div>
        </div>
      </div>

      <div class="field">
        <label>Photos &amp; videos (first one becomes the cover — up to 6)</label>
        <div class="drop" id="pfDrop">
          <b>⬆️ Tap to upload or drag &amp; drop</b>
          Photos (JPG/PNG/WEBP) — auto-compressed. Videos (MP4/WEBM) max 2.5 MB
        </div>
        <input type="file" id="pfFile" accept="image/*,video/*" multiple hidden>
        <div class="mlist" id="pfMedia"></div>
      </div>
    </div>
    <div class="m-foot">
      <button class="btn btn-ghost" id="mCancel" type="button">Cancel</button>
      <button class="btn btn-pri" id="mSave" type="button">✅ Submit Product</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/products.js"></script>
</body>
</html>

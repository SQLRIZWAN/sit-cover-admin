<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Orders — Sit Cover Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/shop-logo.webp" type="image/webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" media="print" onload="this.media=&#39;all&#39;">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"></noscript>
<link rel="stylesheet" href="css/admin.css">
</head>
<body data-nav="orders">
  <div id="preloader">
    <div class="pre-card">
      <img src="assets/shop-logo.webp" alt="logo">
      <div class="pre-name">Sit Cover Admin</div>
      <div class="pre-sub">Orders</div>
      <div class="pre-bar"><i></i></div>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="side" id="adminSide"></aside>

  <div class="main">
    <header class="top" id="adminTop"></header>

    <div class="wrap-a">
      <div class="login-err" id="bootErr"></div>

      <div class="page-head">
        <div>
          <h2>Orders</h2>
          <div class="sub" id="ordSub">Live from the website</div>
        </div>
        <div class="sub" id="ordCount"></div>
      </div>

      <div class="ochips" id="statusChips">
        <button class="chip on" data-st="all">All</button>
        <button class="chip" data-st="new">⏳ Pending</button>
        <button class="chip" data-st="confirmed">✅ Confirmed</button>
        <button class="chip" data-st="shipped">🚚 Out for delivery</button>
        <button class="chip" data-st="delivered">📦 Completed</button>
        <button class="chip" data-st="cancelled">❌ Cancelled</button>
      </div>

      <div id="oList"></div>
    </div>
  </div>

  <div class="mask" id="mMask"></div>
  <div class="modal wide" id="oModal">
    <div class="m-head">
      <h3 id="omTitle">Order</h3>
      <button class="x" id="omClose" type="button">✕</button>
    </div>
    <div class="m-body" id="omBody"></div>
    <div class="m-foot" id="omFoot"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
